name: Kreative Core Company Control

on:
  workflow_dispatch:
    inputs:
      operation:
        description: İşlem
        required: true
        type: choice
        default: bootstrap-engine
        options:
          - bootstrap-engine
          - engine-health
          - scan-intake
          - analyze-project
          - execute-task
          - auto-cycle
          - review-pr
      target:
        description: Proje slug, görev slug/issue numarası veya PR numarası
        required: false
        type: string
        default: ""
      agent:
        description: Görevi çalıştıracak ajan
        required: true
        type: choice
        default: coder
        options:
          - analyst
          - planner
          - researcher
          - product
          - architect
          - coder
          - designer
          - reviewer
          - growth
      confirm:
        description: RUN yaz
        required: true
        type: string
        default: "NO"

  schedule:
    - cron: "0 5 * * *"
    - cron: "17 */6 * * *"

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

concurrency:
  group: kreative-core-company-control
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      ENGINE_TAG: ai-engine-v2
      ENGINE_RELEASE_TAG: ai-engine-v2
      MODEL_REPO: Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF
      MODEL_FILE: qwen2.5-coder-1.5b-instruct-q4_k_m.gguf

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve request
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            if [[ "${{ github.event.schedule }}" == "0 5 * * *" ]]; then
              operation="scan-intake"
            else
              operation="auto-cycle"
            fi
            target=""
            agent="operator"
          else
            operation="${{ inputs.operation }}"
            target="${{ inputs.target }}"
            agent="${{ inputs.agent }}"

            if [[ "${{ inputs.confirm }}" != "RUN" ]]; then
              echo "::error::Confirm alanına RUN yazılmalı."
              exit 64
            fi
          fi

          case "$operation" in
            analyze-project|execute-task|review-pr)
              if [[ -z "$target" ]]; then
                echo "::error::Bu işlem için Target zorunlu."
                exit 64
              fi
              ;;
          esac

          printf 'OPERATION=%s\n' "$operation" >> "$GITHUB_ENV"
          printf 'TARGET=%s\n' "$target" >> "$GITHUB_ENV"
          printf 'AGENT=%s\n' "$agent" >> "$GITHUB_ENV"

      - name: Select next automatic issue
        if: env.OPERATION == 'auto-cycle'
        shell: bash
        run: python scripts/company_dispatcher.py

      - name: Install model downloader
        if: env.OPERATION == 'bootstrap-engine'
        run: |
          python -m pip install --disable-pip-version-check \
            "huggingface_hub>=0.30,<2"

      - name: Download official Qwen model
        if: env.OPERATION == 'bootstrap-engine'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p engine-assets
          hf download "$MODEL_REPO" "$MODEL_FILE" \
            --local-dir engine-assets

      - name: Download official llama.cpp CPU engine
        if: env.OPERATION == 'bootstrap-engine'
        shell: bash
        run: |
          set -euo pipefail

          gh api repos/ggml-org/llama.cpp/releases/latest \
            > engine-assets/llama-release.json

          asset_url="$(
            jq -r '
              .assets[]
              | select(
                  .name
                  | test("llama-.*-bin-ubuntu-x64\\.tar\\.gz$")
                )
              | .browser_download_url
            ' engine-assets/llama-release.json \
            | head -n 1
          )"

          if [[ -z "$asset_url" || "$asset_url" == "null" ]]; then
            echo "::error::Uyumlu llama.cpp Ubuntu x64 paketi bulunamadı."
            exit 1
          fi

          curl --fail --location --retry 3 \
            "$asset_url" \
            --output engine-assets/llama-cpp-ubuntu-x64.tar.gz

      - name: Create engine manifest
        if: env.OPERATION == 'bootstrap-engine'
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("engine-assets")
          release = json.loads(
              (root / "llama-release.json").read_text(encoding="utf-8")
          )

          names = [
              "qwen2.5-coder-1.5b-instruct-q4_k_m.gguf",
              "llama-cpp-ubuntu-x64.tar.gz",
          ]

          manifest = {
              "version": 1,
              "model_source": "Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF",
              "model_license": "Apache-2.0",
              "llama_cpp_source": "ggml-org/llama.cpp",
              "llama_cpp_release": release["tag_name"],
              "assets": [],
          }

          for name in names:
              path = root / name
              manifest["assets"].append(
                  {
                      "name": name,
                      "size": path.stat().st_size,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  }
              )

          (root / "engine-manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Create or verify engine release
        if: env.OPERATION == 'bootstrap-engine'
        shell: bash
        run: |
          set -euo pipefail

          required_assets=(
            "qwen2.5-coder-1.5b-instruct-q4_k_m.gguf"
            "llama-cpp-ubuntu-x64.tar.gz"
            "engine-manifest.json"
          )

          if gh release view "$ENGINE_TAG" >/dev/null 2>&1; then
            echo "Release $ENGINE_TAG already exists; verifying assets."

            existing_assets="$(
              gh release view "$ENGINE_TAG" \
                --json assets \
                --jq '.assets[].name'
            )"

            for asset in "${required_assets[@]}"; do
              if ! grep -Fxq "$asset" <<< "$existing_assets"; then
                echo "::error::Existing immutable release is incomplete: $asset is missing."
                exit 1
              fi
            done

            echo "Existing engine release is complete."
          else
            gh release create "$ENGINE_TAG" \
              --draft \
              --title "Kreative Core AI Engine v2" \
              --notes "Open model and llama.cpp CPU runtime assets."

            gh release upload "$ENGINE_TAG" \
              engine-assets/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf \
              engine-assets/llama-cpp-ubuntu-x64.tar.gz \
              engine-assets/engine-manifest.json

            gh release edit "$ENGINE_TAG" --draft=false
            echo "Engine release published after all assets were attached."
          fi

      - name: Restore engine cache
        if: >-
          env.OPERATION == 'engine-health' ||
          env.OPERATION == 'analyze-project' ||
          env.OPERATION == 'execute-task' ||
          env.OPERATION == 'review-pr'
        uses: actions/cache@v5
        with:
          path: .engine-cache
          key: kreativecore-ai-engine-v1

      - name: Fetch and verify engine
        if: >-
          env.OPERATION == 'engine-health' ||
          env.OPERATION == 'analyze-project' ||
          env.OPERATION == 'execute-task' ||
          env.OPERATION == 'review-pr'
        shell: bash
        run: bash scripts/fetch_engine.sh .

      - name: Start local model
        if: >-
          env.OPERATION == 'engine-health' ||
          env.OPERATION == 'analyze-project' ||
          env.OPERATION == 'execute-task' ||
          env.OPERATION == 'review-pr'
        shell: bash
        run: bash scripts/start_engine.sh .

      - name: Test AI engine
        if: env.OPERATION == 'engine-health'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from engine.json_protocol import extract_json
          from engine.runtime import client

          response = client(Path(".").resolve()).chat(
              system="Return only valid JSON.",
              user='Return exactly {"status":"ok","engine":"local"}.',
              max_tokens=48,
              temperature=0,
          )

          result = extract_json(response)
          assert result.get("status") == "ok", result
          print(result)
          PY

      - name: Scan projects and tasks
        if: env.OPERATION == 'scan-intake'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/company_orchestrator.py .
          python scripts/sync_company_issues.py .

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add tasks/.company tasks/projects tasks/inbox

          if git diff --cached --quiet; then
            echo "Şirket hafızasında değişiklik yok."
          else
            git commit -m "chore(company): refresh intake and routing"
            git push
          fi

      - name: Create AI analysis branch
        if: env.OPERATION == 'analyze-project'
        shell: bash
        run: |
          set -euo pipefail
          safe_target="$(printf '%s' "$TARGET" | tr -c 'A-Za-z0-9._-' '-')"
          branch="ai/analyze-${safe_target}-${GITHUB_RUN_NUMBER}"
          git switch -c "$branch"
          printf 'AI_BRANCH=%s\n' "$branch" >> "$GITHUB_ENV"

      - name: Analyze project
        if: env.OPERATION == 'analyze-project'
        shell: bash
        run: python -m engine.analyze_project "$TARGET"

      - name: Publish analysis pull request
        if: env.OPERATION == 'analyze-project'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "kreative-core-ai[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "tasks/projects/$TARGET/.company"
          git commit -m "docs(ai): analyze $TARGET"
          git push --set-upstream origin "$AI_BRANCH"

          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$AI_BRANCH" \
            --title "[AI Analysis] $TARGET" \
            --body "Yerel GitHub-hosted açık model tarafından üretilen Analyst, Planner ve Architect raporu. Manuel inceleme gereklidir."

      - name: Create AI task branch
        if: env.OPERATION == 'execute-task'
        shell: bash
        run: |
          set -euo pipefail
          safe_target="$(printf '%s' "$TARGET" | tr -c 'A-Za-z0-9._-' '-')"
          branch="ai/task-${safe_target}-${GITHUB_RUN_NUMBER}"
          git switch -c "$branch"
          printf 'AI_BRANCH=%s\n' "$branch" >> "$GITHUB_ENV"

      - name: Execute task
        if: env.OPERATION == 'execute-task'
        shell: bash
        run: |
          python -m engine.execute_task \
            "$TARGET" \
            --agent "$AGENT"

      - name: Publish task pull request
        if: env.OPERATION == 'execute-task'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "kreative-core-ai[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # Runtime/model/cache files must never enter a task commit.
          rm -rf .engine-cache .engine-runtime
          find . -type d -name "__pycache__" -prune -exec rm -rf {} +
          find . -type f \( -name "*.pyc" -o -name "*.pyo" \) -delete

          # Stage real repository changes while explicitly excluding generated
          # runtime and cache paths. This still allows coder agents to modify
          # legitimate application files outside tasks/ and reports/.
          git add --all -- . \
            ':(exclude).engine-cache/**' \
            ':(exclude).engine-runtime/**' \
            ':(exclude)**/__pycache__/**' \
            ':(exclude)**/*.pyc' \
            ':(exclude)**/*.pyo'

          # Safety check: reject accidental large files before commit/push.
          while IFS= read -r staged_file; do
            [[ -f "$staged_file" ]] || continue
            size="$(stat -c '%s' "$staged_file")"
            if (( size > 50000000 )); then
              echo "::error::Staged file exceeds 50 MB safety limit: $staged_file ($size bytes)"
              exit 1
            fi
          done < <(git diff --cached --name-only --diff-filter=ACMR)

          if git diff --cached --quiet; then
            echo "::error::AI herhangi bir kalıcı dosya değişikliği üretmedi."
            exit 1
          fi

          echo "Files selected for AI task pull request:"
          git diff --cached --name-status

          git commit -m "feat(ai): execute task $TARGET"
          git push --set-upstream origin "$AI_BRANCH"

          pr_url="$(
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$AI_BRANCH" \
              --title "[AI Task] $TARGET" \
              --body "Yerel GitHub-hosted açık model tarafından üretilen görev çıktısı. Test raporları reports/ klasöründedir. Runtime, model ve cache dosyaları commit dışında bırakılmıştır. Manuel inceleme gereklidir."
          )"

          echo "Created pull request: $pr_url"

          if [[ "$TARGET" =~ ^[0-9]+$ ]]; then
            gh label create "status:review" \
              --color "1D76DB" \
              --description "AI output is waiting for human review or merge." \
              --force

            gh issue edit "$TARGET" \
              --remove-label "status:running" \
              --add-label "status:review" || true

            gh issue comment "$TARGET" \
              --body "AI çıktısı inceleme için hazır: $pr_url" || true
          fi

      - name: Review pull request
        if: env.OPERATION == 'review-pr'
        shell: bash
        run: |
          if [[ ! "$TARGET" =~ ^[0-9]+$ ]]; then
            echo "::error::Review için Target alanı PR numarası olmalı."
            exit 64
          fi

          python -m engine.review_pr "$TARGET"

      - name: Mark automatic issue blocked
        if: failure() && env.AUTO_DISPATCH == 'true' && env.TARGET != ''
        shell: bash
        run: |
          gh label create "status:blocked"             --color "B60205"             --description "Automatic execution stopped and needs attention."             --force

          gh issue edit "$TARGET"             --remove-label "status:running"             --add-label "status:blocked" || true

          gh issue comment "$TARGET"             --body "Otomatik yürütme başarısız oldu. Actions logunun incelenmesi gerekiyor." || true

      - name: Stop local model
        if: always()
        shell: bash
        run: bash scripts/stop_engine.sh . || true

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Kreative Core Company Control"
            echo
            echo "- Operation: \`$OPERATION\`"
            echo "- Target: \`$TARGET\`"
            echo "- Agent: \`$AGENT\`"
            echo "- Model API cost: **none**"
          } >> "$GITHUB_STEP_SUMMARY"
