          set -euo pipefail
          python -m engine.intake . --sync-issues

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add tasks/.company tasks/projects tasks/inbox

          if git diff --cached --quiet; then
            echo "Şirket hafızasında değişiklik yok."
          else
            git commit -m "chore(company): refresh intake and routing"
            git push
          fi

      - name: Create AI analysis branch
        if: env.OPERATION == 'analyze-project'
        shell: bash
        run: |
          set -euo pipefail
          safe_target="$(printf '%s' "$TARGET" | tr -c 'A-Za-z0-9._-' '-')"
          branch="ai/analyze-${safe_target}-${GITHUB_RUN_NUMBER}"
          git switch -c "$branch"
          printf 'AI_BRANCH=%s\n' "$branch" >> "$GITHUB_ENV"

      - name: Analyze project
        if: env.OPERATION == 'analyze-project'
        shell: bash
        run: python -m engine.analyze_project "$TARGET"

      - name: Publish analysis pull request
        if: env.OPERATION == 'analyze-project'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "kreative-core-ai[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "tasks/projects/$TARGET/.company"
          git commit -m "docs(ai): analyze $TARGET"
          git push --set-upstream origin "$AI_BRANCH"

          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$AI_BRANCH" \
            --title "[AI Analysis] $TARGET" \
            --body "Yerel GitHub-hosted açık model tarafından üretilen Analyst, Planner ve Architect raporu. Manuel inceleme gereklidir."

      - name: Create AI task branch
        if: env.OPERATION == 'execute-task'
        shell: bash
        run: |
          set -euo pipefail
          safe_target="$(printf '%s' "$TARGET" | tr -c 'A-Za-z0-9._-' '-')"
          branch="ai/task-${safe_target}-${GITHUB_RUN_NUMBER}"
          git switch -c "$branch"
          printf 'AI_BRANCH=%s\n' "$branch" >> "$GITHUB_ENV"

      - name: Execute task
        if: env.OPERATION == 'execute-task'
        shell: bash
        run: |
          python -m engine.execute_task \
            "$TARGET" \
            --agent "$AGENT"

      - name: Publish task pull request
        if: env.OPERATION == 'execute-task'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "kreative-core-ai[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add --all

          if git diff --cached --quiet; then
            echo "::error::AI herhangi bir dosya değişikliği üretmedi."
            exit 1
          fi

          git commit -m "feat(ai): execute task $TARGET"
          git push --set-upstream origin "$AI_BRANCH"

          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$AI_BRANCH" \
            --title "[AI Task] $TARGET" \
            --body "Yerel GitHub-hosted açık model tarafından üretilen görev çıktısı. Test raporları reports/ klasöründedir. Manuel inceleme gereklidir."

      - name: Review pull request
        if: env.OPERATION == 'review-pr'
        shell: bash
        run: |
          if [[ ! "$TARGET" =~ ^[0-9]+$ ]]; then
            echo "::error::Review için Target alanı PR numarası olmalı."
            exit 64
          fi

          python -m engine.review_pr "$TARGET"

      - name: Stop local model
        if: always()
        shell: bash
        run: bash scripts/stop_engine.sh . || true

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Kreative Core Company Control"
            echo
            echo "- Operation: \`$OPERATION\`"
            echo "- Target: \`$TARGET\`"
            echo "- Agent: \`$AGENT\`"
            echo "- Model API cost: **none**"
          } >> "$GITHUB_STEP_SUMMARY"
