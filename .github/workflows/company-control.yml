Bir kere kurup sonra telefondan kullanacağımız yapı

Bugün bu ödünç bilgisayardan veya Codespaces üzerinden:

Sağlam bir .gitignore ekleyeceğiz.
PR #13’teki yanlış node_modules dosyalarını temizleyeceğiz.
Repoya Mobile Control adlı güvenli bir GitHub Actions workflow’u ekleyeceğiz.
Workflow içinde yalnızca önceden tanımlı işlemler olacak:
testleri çalıştır
projeyi derle
PR dalını kontrol et
bağımlılık artıklarını temizle
deploy işlemini çalıştır

Sonrasında telefondan yalnızca:

GitHub → Actions → Mobile Control → Run workflow

diyerek işlemleri başlatabileceksin. Rastgele terminal komutu çalıştıran tehlikeli bir sistem değil; yalnızca bizim tanımladığımız güvenli görevler olacak.

Şimdi ödünç bilgisayarda repo sayfasını açıp Code → Codespaces → Create codespace adımına geçelim. Açılan ekranın görüntüsünü gönder; oradan PR temizliğini ve mobil kontrol sistemini birlikte kuracağız. Ayrıca sohbette paylaştığın eski tokenın GitHub’dan iptal edilmiş olduğundan emin ol.

