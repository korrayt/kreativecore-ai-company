Public yapmak şu aşamada işi kolaylaştırır. Repoyu doğrudan inceleyebilir, workflow dosyalarının görünürlüğünü ve hataları kontrol edebilirim. Ayrıca public repolarda standart GitHub-hosted Actions kullanımı ücretsizdir; private repolarda ise hesabının aylık Actions kotasından düşer.

