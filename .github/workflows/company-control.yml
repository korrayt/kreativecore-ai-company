Önceki repair ZIP’ini tekrar yükleme. Commit sonrası Actions ekranının görüntüsünü gönder; bootstrap’ı birlikte başlatalım. 

Kitaplık
/
KREATIVE_CORE_COMPANY_CONTROL.yml
name: Kreative Core Company Control

on:
  workflow_dispatch:
    inputs:
      operation:
        description: İşlem
        required: true
        type: choice
        default: bootstrap-engine
        options:
          - bootstrap-engine
          - engine-health
          - scan-intake
          - analyze-project
          - execute-task
          - review-pr
      target:
        description: Proje slug, görev slug/issue numarası veya PR numarası
        required: false
        type: string
        default: ""
      agent:
        description: Görevi çalıştıracak ajan
        required: true
        type: choice
        default: coder
        options:
          - analyst
          - planner
          - researcher
          - product
          - architect
          - coder
          - designer
          - reviewer
          - growth
      confirm:
        description: RUN yaz
        required: true
        type: string
        default: "NO"

  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

concurrency:
  group: kreative-core-company-control
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      GH_TOKEN: ${{ github.token }}
      ENGINE_TAG: ai-engine-v1
      MODEL_REPO: Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF
      MODEL_FILE: qwen2.5-coder-1.5b-instruct-q4_k_m.gguf

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve request
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            operation="scan-intake"
            target=""
            agent="operator"
          else
            operation="${{ inputs.operation }}"
            target="${{ inputs.target }}"
            agent="${{ inputs.agent }}"

            if [[ "${{ inputs.confirm }}" != "RUN" ]]; then
              echo "::error::Confirm alanına RUN yazılmalı."
              exit 64
            fi
          fi

          case "$operation" in
            analyze-project|execute-task|review-pr)
              if [[ -z "$target" ]]; then
                echo "::error::Bu işlem için Target zorunlu."
                exit 64
              fi
              ;;
          esac

          printf 'OPERATION=%s\n' "$operation" >> "$GITHUB_ENV"
          printf 'TARGET=%s\n' "$target" >> "$GITHUB_ENV"
          printf 'AGENT=%s\n' "$agent" >> "$GITHUB_ENV"

      - name: Install model downloader
        if: env.OPERATION == 'bootstrap-engine'
        run: |
          python -m pip install --disable-pip-version-check \
            "huggingface_hub>=0.30,<2"

      - name: Download official Qwen model
        if: env.OPERATION == 'bootstrap-engine'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p engine-assets
          hf download "$MODEL_REPO" "$MODEL_FILE" \
            --local-dir engine-assets

      - name: Download official llama.cpp CPU engine
        if: env.OPERATION == 'bootstrap-engine'
        shell: bash
        run: |
          set -euo pipefail

          gh api repos/ggml-org/llama.cpp/releases/latest \
            > engine-assets/llama-release.json

          asset_url="$(
            jq -r '
              .assets[]
              | select(
                  .name
                  | test("llama-.*-bin-ubuntu-x64\\.tar\\.gz$")
                )
              | .browser_download_url
            ' engine-assets/llama-release.json \
            | head -n 1
          )"

          if [[ -z "$asset_url" || "$asset_url" == "null" ]]; then
            echo "::error::Uyumlu llama.cpp Ubuntu x64 paketi bulunamadı."
            exit 1
          fi

          curl --fail --location --retry 3 \
            "$asset_url" \
            --output engine-assets/llama-cpp-ubuntu-x64.tar.gz

      - name: Create engine manifest
        if: env.OPERATION == 'bootstrap-engine'
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("engine-assets")
          release = json.loads(
              (root / "llama-release.json").read_text(encoding="utf-8")
          )

          names = [
              "qwen2.5-coder-1.5b-instruct-q4_k_m.gguf",
              "llama-cpp-ubuntu-x64.tar.gz",
          ]

          manifest = {
              "version": 1,
              "model_source": "Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF",
              "model_license": "Apache-2.0",
              "llama_cpp_source": "ggml-org/llama.cpp",
              "llama_cpp_release": release["tag_name"],
              "assets": [],
          }

          for name in names:
              path = root / name
              manifest["assets"].append(
                  {
                      "name": name,
                      "size": path.stat().st_size,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  }
              )

          (root / "engine-manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Create or update engine release
        if: env.OPERATION == 'bootstrap-engine'
        shell: bash
        run: |
          set -euo pipefail

          if ! gh release view "$ENGINE_TAG" >/dev/null 2>&1; then
            gh release create "$ENGINE_TAG" \
              --title "Kreative Core AI Engine v1" \
              --notes "Open model and llama.cpp CPU runtime assets."
          fi

          gh release upload "$ENGINE_TAG" \
            engine-assets/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf \
            engine-assets/llama-cpp-ubuntu-x64.tar.gz \
            engine-assets/engine-manifest.json \
            --clobber

      - name: Restore engine cache
        if: >-
          env.OPERATION == 'engine-health' ||
          env.OPERATION == 'analyze-project' ||
          env.OPERATION == 'execute-task' ||
          env.OPERATION == 'review-pr'
        uses: actions/cache@v5
        with:
          path: .engine-cache
          key: kreativecore-ai-engine-v1

      - name: Fetch and verify engine
        if: >-
          env.OPERATION == 'engine-health' ||
          env.OPERATION == 'analyze-project' ||
          env.OPERATION == 'execute-task' ||
          env.OPERATION == 'review-pr'
        shell: bash
        run: bash scripts/fetch_engine.sh .

      - name: Start local model
        if: >-
          env.OPERATION == 'engine-health' ||
          env.OPERATION == 'analyze-project' ||
          env.OPERATION == 'execute-task' ||
          env.OPERATION == 'review-pr'
        shell: bash
        run: bash scripts/start_engine.sh .

      - name: Test AI engine
        if: env.OPERATION == 'engine-health'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from engine.json_protocol import extract_json
          from engine.runtime import client

          response = client(Path(".").resolve()).chat(
              system="Return only valid JSON.",
              user='Return exactly {"status":"ok","engine":"local"}.',
              max_tokens=48,
              temperature=0,
          )

          result = extract_json(response)
          assert result.get("status") == "ok", result
          print(result)
          PY

      - name: Scan projects and tasks
        if: env.OPERATION == 'scan-intake'
        shell: bash
        run: |
          set -euo pipefail
          python -m engine.intake . --sync-issues

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add tasks/.company tasks/projects tasks/inbox

          if git diff --cached --quiet; then
            echo "Şirket hafızasında değişiklik yok."
          else
            git commit -m "chore(company): refresh intake and routing"
            git push
          fi

      - name: Create AI analysis branch
        if: env.OPERATION == 'analyze-project'
        shell: bash
        run: |
          set -euo pipefail
          safe_target="$(printf '%s' "$TARGET" | tr -c 'A-Za-z0-9._-' '-')"
          branch="ai/analyze-${safe_target}-${GITHUB_RUN_NUMBER}"
          git switch -c "$branch"
          printf 'AI_BRANCH=%s\n' "$branch" >> "$GITHUB_ENV"

      - name: Analyze project
        if: env.OPERATION == 'analyze-project'
        shell: bash
        run: python -m engine.analyze_project "$TARGET"

      - name: Publish analysis pull request
        if: env.OPERATION == 'analyze-project'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "kreative-core-ai[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "tasks/projects/$TARGET/.company"
          git commit -m "docs(ai): analyze $TARGET"
          git push --set-upstream origin "$AI_BRANCH"

          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$AI_BRANCH" \
            --title "[AI Analysis] $TARGET" \
            --body "Yerel GitHub-hosted açık model tarafından üretilen Analyst, Planner ve Architect raporu. Manuel inceleme gereklidir."

      - name: Create AI task branch
        if: env.OPERATION == 'execute-task'
        shell: bash
        run: |
          set -euo pipefail
          safe_target="$(printf '%s' "$TARGET" | tr -c 'A-Za-z0-9._-' '-')"
          branch="ai/task-${safe_target}-${GITHUB_RUN_NUMBER}"
          git switch -c "$branch"
          printf 'AI_BRANCH=%s\n' "$branch" >> "$GITHUB_ENV"

      - name: Execute task
        if: env.OPERATION == 'execute-task'
        shell: bash
        run: |
          python -m engine.execute_task \
            "$TARGET" \
            --agent "$AGENT"

      - name: Publish task pull request
        if: env.OPERATION == 'execute-task'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "kreative-core-ai[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add --all

          if git diff --cached --quiet; then
            echo "::error::AI herhangi bir dosya değişikliği üretmedi."
            exit 1
          fi

          git commit -m "feat(ai): execute task $TARGET"
          git push --set-upstream origin "$AI_BRANCH"

          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$AI_BRANCH" \
            --title "[AI Task] $TARGET" \
            --body "Yerel GitHub-hosted açık model tarafından üretilen görev çıktısı. Test raporları reports/ klasöründedir. Manuel inceleme gereklidir."

      - name: Review pull request
        if: env.OPERATION == 'review-pr'
        shell: bash
        run: |
          if [[ ! "$TARGET" =~ ^[0-9]+$ ]]; then
            echo "::error::Review için Target alanı PR numarası olmalı."
            exit 64
          fi

          python -m engine.review_pr "$TARGET"

      - name: Stop local model
        if: always()
        shell: bash
        run: bash scripts/stop_engine.sh . || true

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Kreative Core Company Control"
            echo
            echo "- Operation: \`$OPERATION\`"
            echo "- Target: \`$TARGET\`"
            echo "- Agent: \`$AGENT\`"
            echo "- Model API cost: **none**"
          } >> "$GITHUB_STEP_SUMMARY"

