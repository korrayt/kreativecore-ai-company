Güvenli çalışma şekli

AI doğrudan ana dala yazmayacak.

Her görevde:

Temiz bir Git worktree veya Docker sandbox oluşturacak.
Yalnızca görevle ilgili dosyalara erişecek.
İzin verilen terminal komutlarını kullanacak.
Testleri çalıştıracak.
Güvenlik taramasından geçecek.
Yeni branch açacak.
Pull request oluşturacak.
Sen telefondan kontrol edip merge edeceksin.

Finans, hukuk, güvenlik, ödeme, yayın ve veri silme gibi işler otomatik uygulanmayacak; yalnızca öneri ve plan üretip senin onayını bekleyecek.

En doğru tercih

İlk çalışan sürüm için önerim:

GitHub Private Repo
+ GitHub Self-hosted Runner
+ Docker
+ Ollama
+ Qwen3-Coder veya Devstral
+ OpenHands Agent SDK
+ Kreative Core Company Orchestrator

Bu, dışarıya kullanım başına ödeme yapmayan gerçek in-house AI yazılım şirketi olur.

Tek zorunlu eksik bilgi, motoru çalıştıracak cihazın gücü: Windows/Linux/Mac, işlemci, RAM, ekran kartı modeli ve ekran kartı belleği kaç GB? Buna göre model ve engine sürümünü net seçelim.

