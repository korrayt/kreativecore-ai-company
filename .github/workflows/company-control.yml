Evet, “engine” tam doğru kelime. Ama tek parça değil; kendi bünyemizde çalışan AI şirketi için dört katman kuracağız:

Model — beyin: Kod anlayan açık ağırlıklı model.
Inference engine — motor: Modeli bilgisayarda çalıştıran Ollama veya llama.cpp.
Agent runtime — çalışan: Dosya okuyan, terminal kullanan, kod değiştiren ve test yapan OpenHands tabanlı sistem.
Company orchestrator — yönetim: Bizim hazırladığımız departmanlar, görev dağılımı, onay kapıları ve günlük otomasyon.
Kuracağımız gerçek sistem
Telefondan görev/proje yükleme
            ↓
GitHub tasks/projects veya tasks/inbox
            ↓
Daily Company Orchestrator
            ↓
Kendi self-hosted runner cihazımız
            ↓
Kreative Core AI Engine
            ↓
Yerel model + departman ajanı
            ↓
Ayrı çalışma alanı / branch
            ↓
Kodlama + test + güvenlik kontrolü
            ↓
Pull request
            ↓
Telefondan senin onayın

Böylece:

Copilot kullanım kredisi yok.
OpenAI, Anthropic veya başka bir modele istek başına ödeme yok.
Kod ve proje bilgileri kendi cihazımızdan çıkmıyor.
Telefon yalnızca şirketin kontrol paneli oluyor.
İşlem gücünü sürekli açık duran kendi bilgisayarımız sağlıyor.

GitHub self-hosted runner kullanımı için ayrıca Actions işlem ücreti alınmıyor; fakat cihaz, elektrik ve bakım bize ait oluyor. GitHub ayrıca self-hosted runner’ların yalnızca özel repolarda kullanılmasını özellikle öneriyor, çünkü public repodaki zararlı bir pull request yerel makinede kod çalıştırabilir.

Neden modeli doğrudan GitHub Actions içinde çalıştırmıyoruz?

GitHub’ın standart runner’ı her işte yeni bir sanal makine açıyor ve görev bitince makineyi siliyor. Dolayısıyla modelin her çalışmada tekrar indirilmesi, belleğe yüklenmesi ve CPU üzerinde çalışması gerekir; ciddi coding agent işleri için verimsiz olur.

Kendi runner cihazımızdaysa:

model diskte kalır,
model bellekte sıcak tutulabilir,
GPU sürekli kullanılabilir,
görev geldiğinde birkaç saniye içinde iş başlayabilir.

Cihaz kapalıysa GitHub işi kuyrukta bekletir; uygun runner bulunamazsa iş en fazla 24 saat sonra zaman aşımına uğrar.

Kullanacağımız açık kaynak parçalar
1. Model motoru: Ollama

İlk sürüm için en rahat seçenek Ollama. Windows, macOS ve Linux üzerinde yerel modelleri indirip API olarak sunabiliyor. Linux’ta servis olarak sürekli açık çalıştırılabiliyor.

Alternatif olarak daha hafif ve kontrol edilebilir llama.cpp kullanabiliriz. llama-server, CPU/GPU üzerinde quantized modeller çalıştırıyor; OpenAI uyumlu chat, embeddings ve tool-calling uçları sağlıyor.

Benim başlangıç tercihim:

Ollama

Daha sonra performans ve bellek optimizasyonu gerekirse:

llama.cpp

altyapısına ineriz.

2. Coding modeli

Güçlü cihaz varsa iki ciddi aday var:

Qwen3-Coder-30B-A3B-Instruct: Repo ölçeğinde kod anlayışı ve agentic coding için geliştirilmiş; toplam 30,5 milyar parametreli fakat her adımda yaklaşık 3,3 milyar parametreyi etkinleştiren MoE yapıda.
Devstral Small 2 24B: Yazılım mühendisliği ajanları için geliştirilmiş, yerelde çalıştırılabilen açık model.

OpenHands’in yerel model rehberi de özellikle Qwen3-Coder-30B ve Devstral Small 2’yi öneriyor. Qwen3-Coder için örnek minimum olarak 12 GB VRAM + 64 GB sistem belleği veya en az 32 GB birleşik belleğe sahip Apple Silicon belirtiliyor.

Donanım daha zayıfsa ilk aşamada daha küçük bir coder model çalıştırırız; ancak küçük modellerde terminal kullanımı, JSON üretimi ve uzun görevlerde tutarlılık belirgin biçimde düşebilir. OpenHands de yerel modellerin güçlü GPU istediğini ve daha küçük modellerde hatalı tool call görülebileceğini açıkça belirtiyor.

3. Agent runtime: OpenHands çekirdeği

OpenHands’in açık kaynak çekirdeğini kullanabiliriz. Kod tabanının ana bölümü ve agent-server Docker görüntüleri MIT lisanslı; yerel model, terminal, dosya düzenleme ve sandbox çalışma akışını destekliyor.

Ama OpenHands’i olduğu gibi “şirket” yapmayacağız. Üzerine kendi katmanımızı yazacağız:

Kreative Core Company Agent Runtime
├── Analyst
├── Planner
├── Architect
├── Coder
├── Designer
├── Reviewer
├── 20 departman ajanı
├── şirket politikaları
└── kurucu onay kapıları

OpenHands yalnızca ajanların elleri ve çalışma masası olacak. Beyin, görev sistemi, hafıza ve şirket yapısı Kreative Core’a ait olacak.

