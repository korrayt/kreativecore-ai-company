name: Emergency Project Restore

"on":
  push:
    branches:
      - Soner-Koray-Taşan
    paths:
      - .github/workflows/emergency-hotfix.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  restore:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}
      BASE_BRANCH: Soner-Koray-Taşan
      HOTFIX_BRANCH: hotfix/restore-project-${{ github.run_id }}
      SAFE_COMMIT: 9e376c5b42d77cffa0ccd8245b27e8f6431a4ea5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: Soner-Koray-Taşan

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$HOTFIX_BRANCH"

      - name: Restore safe files
        run: |
          git checkout "$SAFE_COMMIT" -- \
            engine/execute_task.py \
            tasks/projects/ilk-projem/.company/AI_ANALYSIS.json \
            tasks/projects/ilk-projem/.company/PROJECT_STATE.json

      - name: Remove one-time workflow from hotfix
        run: |
          git rm .github/workflows/emergency-hotfix.yml

      - name: Validate restored files
        run: |
          python -m py_compile engine/execute_task.py
          python engine/validate_repo.py .

          python - <<'PY'
          import json
          from pathlib import Path

          files = [
              "tasks/projects/ilk-projem/.company/AI_ANALYSIS.json",
              "tasks/projects/ilk-projem/.company/PROJECT_STATE.json",
          ]

          for filename in files:
              with Path(filename).open(encoding="utf-8") as stream:
                  json.load(stream)

              print(f"Valid JSON: {filename}")
          PY

      - name: Commit and push repair
        run: |
          git add --all
          git commit -m "fix: restore safe project state"
          git push --set-upstream origin "$HOTFIX_BRANCH"

      - name: Open repair pull request
        id: pr
        run: |
          PR_URL="$(gh pr create \
            --base "$BASE_BRANCH" \
            --head "$HOTFIX_BRANCH" \
            --title "[HOTFIX] Restore safe project state" \
            --body "Restores the project JSON files damaged by AI Task #4 and temporarily restores the last safe task executor. The one-time emergency workflow removes itself in this PR.")"

          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "$PR_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Pause automatic Issue 4 execution
        run: |
          gh issue edit 4 --remove-label "local-ai:auto" || true
          gh issue edit 4 --remove-label "status:review" || true
          gh issue edit 4 --add-label "status:blocked" || true

          gh issue comment 4 \
            --body "Acil onarım PR'ı hazır: ${{ steps.pr.outputs.url }}"