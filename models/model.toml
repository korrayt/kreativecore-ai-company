[model]
name = "Qwen2.5-Coder-1.5B-Instruct"
source_repo = "Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF"
source_file = "qwen2.5-coder-1.5b-instruct-q4_k_m.gguf"
release_tag = "ai-engine-v1"
release_asset = "qwen2.5-coder-1.5b-instruct-q4_k_m.gguf"
context_size = 4096
threads = 2
temperature = 0.15
max_tokens_analysis = 900
max_tokens_code = 1400
max_tokens_review = 900

[llama_cpp]
source_repo = "ggml-org/llama.cpp"
release_channel = "latest"
asset_pattern = "llama-.*-bin-ubuntu-x64.tar.gz"
release_asset = "llama-cpp-ubuntu-x64.tar.gz"

[runtime]
server_host = "127.0.0.1"
server_port = 8080
health_timeout_seconds = 120
