constraints = "Tüm arama ve görüntü işleme yerelde çalışmalıdır."
success_signal = "Kullanıcı 'mavi ceketli adam' yazdığında ilgili video zaman damgasını anında bulabilir."

[product]
product_name = "Vision"
positioning = "Video arşivinizin doğal dille aranan akıllı hafızası."
